<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="lobby" class="screen">
  <h1 class="title-tag">OYUN ODALARI</h1>
  <section class="frame">
    <ul id="roomList" class="rooms" aria-label="Açık odalar"></ul>
    <aside class="profile">
      <button id="avatarBtn" class="avatar" title="Avatarı değiştir" aria-label="Avatarı değiştir"></button>
      <input id="nameInput" class="pill yellow" maxlength="14" placeholder="İsmin" autocomplete="off">
      <button id="createBtn" class="pill cyan">ODA OLUŞTUR</button>
      <button id="joinBtn" class="pill green" disabled>ODAYA KATIL</button>
      <p id="msg" class="msg" role="alert"></p>
    </aside>
  </section>
</main>

<main id="room" class="screen" hidden>
  <h1 id="roomTitle" class="title-tag">ODA</h1>
  <section class="frame">
    <ul id="playerList" class="players"></ul>
    <aside class="profile">
      <p class="ask">Kaç tur oynayacaksınız?</p>
      <div id="roundPicker" class="rounds" role="group" aria-label="Tur sayısı"></div>
      <button id="startBtn" class="pill green">OYUNU BAŞLAT</button>
      <button id="leaveBtn" class="pill pink">ODADAN AYRIL</button>
      <p id="roomMsg" class="msg" role="alert"></p>
    </aside>
  </section>
</main>

<main id="game" class="screen" hidden>
  <h1 class="title-tag">VER TEPKİYİ!</h1>
  <section class="frame arena">
    <div class="stage">
      <div class="prompt-card">
        <div class="prompt-head"><span id="roundLabel"></span><span id="timer"></span></div>
        <p id="promptText" class="prompt-body"></p>
      </div>
      <ul id="reveal" class="reveal" hidden></ul>
      <p id="status" class="ask" role="status"></p>
      <div class="row">
        <button id="gameLeaveBtn" class="pill pink small">ODADAN AYRIL</button>
      </div>
    </div>
    <div class="bottom">
      <div class="hand-box">
        <ul id="hand" class="hand" aria-label="Kartların"></ul>
        <button id="playBtn" class="pill green" disabled>KARTI AT</button>
      </div>
      <div class="chat">
        <ul id="chatLog" class="chat-log" aria-live="polite"></ul>
        <input id="chatInput" class="chat-input" maxlength="200" placeholder="Mesaj yaz..." autocomplete="off">
      </div>
    </div>
  </section>
</main>

<main id="board" class="screen" hidden>
  <h1 class="title-tag">SIRALAMA</h1>
  <section class="frame single">
    <ol id="podium" class="podium" aria-label="İlk üç"></ol>
    <ul id="boardList" class="players board-list" hidden></ul>
    <div class="row">
      <button id="boardBackBtn" class="pill cyan">ODAYA DÖN</button>
      <button id="boardLeaveBtn" class="pill pink">ODADAN AYRIL</button>
    </div>
  </section>
</main>

<button id="muteBtn" class="mute" aria-label="Sesi kapat">🔊</button>

<script src="/socket.io/socket.io.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
